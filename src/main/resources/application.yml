spring:
  application:
    name: gestion-ordenes-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rectificadora}
    username: ${DB_USER:rectificadora}
    password: ${DB_PASSWORD:rectificadora}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
app:
  jwt-secret: ${JWT_SECRET:cambiar-esta-clave-de-desarrollo-por-una-de-32-caracteres}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
