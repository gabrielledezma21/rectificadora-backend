services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rectificadora
      POSTGRES_USER: rectificadora
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rectificadora"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rectificadora
      DB_USER: rectificadora
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "8080:8080"
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
    command: >-
      sh -c 'while true; do
      pg_dump -h postgres -U rectificadora -d rectificadora -Fc -f /backups/rectificadora-$$(date +%Y%m%d-%H%M%S).dump &&
      find /backups -type f -name "*.dump" -mtime +30 -delete;
      sleep 86400;
      done'
volumes:
  postgres_data:
